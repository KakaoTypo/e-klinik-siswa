<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - E-Klinik Siswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container auth-wrapper">
        <header class="auth-header">
            <div class="logo-box">
                <img src="clinic_siswa.png" alt="E-Klinik Siswa Logo">
            </div>
            <div class="brand-title">
                <h1>E-Klinik Siswa</h1>
                <p>New Account Registration</p>
            </div>
        </header>
        <div class="content">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" required placeholder="e.g. Dr. Sarah / Alex Johnson">
                </div>
                <div class="form-group">
                    <label for="userid">ID Number</label>
                    <input type="text" id="userid" required placeholder="e.g. 2023881204 / DR-501">
                </div>
                <div class="form-group">
                    <label for="reg-role">Account Role</label>
                    <select id="reg-role">
                        <option value="student">Student Patient</option>
                        <option value="mo">Medical Officer / Clinic Admin</option>
                        <option value="doctor">Senior Doctor (Dr.)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" required placeholder="Create password">
                </div>
                <button type="submit" class="btn-full">Register Account</button>
            </form>
            <p class="auth-footer">
                Already registered? <a href="login.html">Sign In</a>
            </p>
        </div>
    </div>

    <script>
        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('fullname').value;
            const role = document.getElementById('reg-role').value;
            alert(`Registration complete for ${name} (${role.toUpperCase()})! Please sign in.`);
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
