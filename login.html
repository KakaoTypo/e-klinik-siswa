<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - E-Klinik Siswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container auth-wrapper">
        <header style="justify-content: center;">
            <div class="brand-title" style="text-align: center;">
                <h1>E-Klinik Siswa</h1>
                <p>Campus Health Portal Login</p>
            </div>
        </header>
        <div class="content">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username / ID Number</label>
                    <input type="text" id="username" required placeholder="e.g. 2023881204 / MO-102">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="********">
                </div>
                <div class="form-group">
                    <label>Select Role Portal</label>
                    <select id="role-select">
                        <option value="student">Student Patient</option>
                        <option value="mo">Medical Officer / Clinic Admin</option>
                        <option value="doctor">Senior Doctor (Specialist & Review)</option>
                    </select>
                </div>
                <button type="submit" style="width: 100%; margin-top: 10px;">Sign In</button>
            </form>
            <p style="text-align: center; margin-top: 15px; font-size: 0.85rem;">
                Don't have an account? <a href="register.html" style="color: var(--accent);">Register here</a>
            </p>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const role = document.getElementById('role-select').value;
            
            localStorage.setItem('currentUser', username);
            localStorage.setItem('currentRole', role);

            if (role === 'student') window.location.href = 'student-overview.html';
            else if (role === 'mo') window.location.href = 'mo-overview.html';
            else window.location.href = 'doctor-overview.html';
        }
    </script>
</body>
</html>
